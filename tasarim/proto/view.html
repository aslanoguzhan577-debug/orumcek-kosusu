<!doctype html>
<html><head><meta charset="utf-8"><title>proto view</title>
<style>body{margin:0;background:#111;display:flex;flex-wrap:wrap;gap:4px}img{height:100vh;width:auto}div{color:#fff;font:12px system-ui;position:relative}span{position:absolute;left:4px;top:4px;background:#000a;padding:2px 4px}</style></head>
<body>
<script>
// prototype helper: shows frames a game tab posts with
//   new BroadcastChannel('proto').postMessage({ label, url: canvas.toDataURL('image/jpeg', .9) })
// {clear: true} empties the page.
new BroadcastChannel('proto').onmessage = (e) => {
  if (e.data.clear) { document.body.innerHTML = ''; return; }
  const d = document.createElement('div'); d.innerHTML = `<img src="${e.data.url}"><span>${e.data.label}</span>`;
  document.body.appendChild(d);
};
</script>
</body></html>
